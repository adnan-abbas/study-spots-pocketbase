<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in – Study Spots</title>
  <link rel="stylesheet" href="css/style.css">

  <!-- jQuery (same library as Project 3). Loaded as a normal script, so the
       global $ exists before our module scripts run. -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"
          integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
          crossorigin="anonymous"></script>

  <!-- nav.js draws the logged-in/logged-out part of the header (on every page).
       auth.js handles the two forms on this page. -->
  <script type="module" src="js/nav.js"></script>
  <script type="module" src="js/auth.js"></script>
</head>
<body>
  <header>
    <p class="site-name">Study Spots</p>
    <nav>
      <ul>
        <li><a href="index.html">All spots</a></li>
        <li id="auth-nav"></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Log in or sign up</h1>

    <div class="form-columns">
      <section>
        <h2>Log in</h2>
        <form id="login-form">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" required>

          <label for="login-password">Password</label>
          <input type="password" id="login-password" required>

          <button type="submit">Log in</button>
          <p id="login-message" class="form-message"></p>
        </form>
      </section>

      <section>
        <h2>Sign up</h2>
        <form id="signup-form">
          <label for="signup-name">Name</label>
          <input type="text" id="signup-name" required>

          <label for="signup-email">Email</label>
          <input type="email" id="signup-email" required>

          <!-- PocketBase requires passwords of at least 8 characters by default -->
          <label for="signup-password">Password (min 8 characters)</label>
          <input type="password" id="signup-password" minlength="8" required>

          <label for="signup-password-confirm">Confirm password</label>
          <input type="password" id="signup-password-confirm" minlength="8" required>

          <button type="submit">Sign up</button>
          <p id="signup-message" class="form-message"></p>
        </form>
      </section>
    </div>
  </main>

  <footer>
    <p>CS 5774 PocketBase starter</p>
  </footer>
</body>
</html>
